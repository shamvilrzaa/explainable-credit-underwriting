[theme]
font = "sans serif"
baseRadius = "small"
showWidgetBorder = true

[theme.light]
base = "light"
primaryColor = "#2F5D96"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1B2430"
borderColor = "#DDE2E8"
dataframeHeaderBackgroundColor = "#F4F6F9"

[theme.dark]
base = "dark"
primaryColor = "#5B8BD0"
backgroundColor = "#0E1319"
secondaryBackgroundColor = "#171E27"
textColor = "#E8ECF2"
borderColor = "#273241"
dataframeHeaderBackgroundColor = "#171E27"

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
