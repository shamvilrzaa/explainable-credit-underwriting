name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[api,dashboard,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m credit_underwriting.train --model gbm
      - run: docker build -t credit-underwriting .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 credit-underwriting
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/v1/decisions \
            -H "Content-Type: application/json" \
            -d '{"income_total": 54000, "credit_amount": 270000, "annuity": 18500, "ext_source_2": 0.4}'
          docker logs api
