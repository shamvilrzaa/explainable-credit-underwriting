[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-underwriting"
version = "0.2.0"
description = "Klarlend: explainable credit underwriting with reason codes, fairness audit, scoring API and review console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dashboard = ["streamlit>=1.33", "plotly>=5.20"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=credit_underwriting --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
