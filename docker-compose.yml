services:
  api:
    build: .
    image: klarlend
    ports:
      - "8000:8000"
    volumes:
      - klarlend-data:/app/data

  console:
    image: klarlend
    depends_on:
      - api
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    ports:
      - "8501:8501"
    volumes:
      - klarlend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s

volumes:
  klarlend-data:
